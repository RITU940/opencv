name: Mission 19 - native MSVC x64 qualification
on:
  push:
    branches: [mission19-fitline4-qualification]
permissions:
  contents: read
jobs:
  msvc:
    if: "${{ !github.event.deleted }}"
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Stock RED and candidate GREEN
        shell: pwsh
        run: >
          python ci/qualify.py msvc --scratch "$env:RUNNER_TEMP/mission19-msvc"
          --artifacts "$env:GITHUB_WORKSPACE/evidence-msvc"
      - name: Archive build, loaded modules, tests, and stack evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mission19-msvc-x64
          path: evidence-msvc/
          if-no-files-found: warn
